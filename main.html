<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LULUCYBTC Main</title>
    <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #071016 0%, #10222a 100%);
        color: #eef7f4;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(880px, calc(100% - 32px));
      }

      img {
        width: 58px;
        height: 58px;
      }

      h1 {
        margin: 18px 0 14px;
        font-size: clamp(2.3rem, 8vw, 5.5rem);
        line-height: 0.96;
      }

      p {
        max-width: 680px;
        color: #9eb5b1;
        font-size: 1.08rem;
        line-height: 1.75;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        margin-top: 18px;
        padding: 0 16px;
        border: 1px solid rgba(67, 211, 137, 0.4);
        border-radius: 8px;
        background: #43d389;
        color: #03120d;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./assets/logo.svg" alt="LULUCYBTC" />
      <h1>LULUCYBTC Main</h1>
      <p>这是 main.lulucybtc.com 的独立主站占位页面，服务监听在服务器本机 18081 端口，不占用默认 80。</p>
      <a href="https://lulucybtc.com">返回 Service Hub</a>
    </main>
  </body>
</html>

log_format lulucybtc_json escape=json
    '{'
    '"time":"$time_iso8601",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"args":"$args",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"remote_addr":"$remote_addr",'
    '"cf_connecting_ip":"$http_cf_connecting_ip",'
    '"cf_country":"$http_cf_ipcountry",'
    '"xff":"$http_x_forwarded_for",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
    '}';

access_log /var/log/nginx/lulucybtc_access.json lulucybtc_json;

ssl_certificate /etc/letsencrypt/live/live.lulucybtc.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/live.lulucybtc.com/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

server {
    listen 80;
    listen 443 ssl;
    server_name lulucybtc.com www.lulucybtc.com;

    root /var/www/lulucybtc;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/lulucybtc;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /live {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host live.lulucybtc.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8001/static/;
        proxy_http_version 1.1;
        proxy_set_header Host live.lulucybtc.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host live.lulucybtc.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /events {
        proxy_pass http://127.0.0.1:8001/events;
        proxy_http_version 1.1;
        proxy_set_header Host live.lulucybtc.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}


<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monitor Unavailable</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #081016;
        color: #eef7f4;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(680px, calc(100% - 32px));
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: #101b23;
        padding: 28px;
      }

      span {
        color: #ffcf5c;
        font-size: 0.82rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      h1 {
        margin: 10px 0;
        font-size: clamp(1.7rem, 5vw, 2.6rem);
      }

      p {
        color: #9eb5b1;
        line-height: 1.7;
      }

      code {
        display: block;
        margin-top: 16px;
        padding: 14px;
        border-radius: 8px;
        background: #071016;
        color: #9eb5b1;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <span>Monitor service unavailable</span>
      <h1>Monitor 服务暂时没有响应</h1>
      <p>Nginx 已经连到服务器，但本机 8000 端口服务断开连接。请在服务器上重启 Monitor 后端。</p>
      <code>curl -v http://127.0.0.1:8000/
ss -lntp | grep ':8000'
ps -ef | grep 8000</code>
    </main>
  </body>
</html>
